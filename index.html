<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sensitivity Label Advisor | مساعد تصنيف البيانات</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:#f3f6fb;color:#1b2430}
  .wrap{max-width:680px;margin:0 auto;padding:20px}
  .card{background:#fff;border-radius:16px;box-shadow:0 6px 24px rgba(15,41,77,.10);padding:24px}
  h1{margin:0 0 4px;font-size:24px;color:#0b5cab}
  .sub{margin:0 0 22px;color:#5b6675;font-size:14px}
  label{display:block;font-weight:600;margin:18px 0 6px}
  select{width:100%;padding:12px;font-size:16px;border:2px solid #d5deec;border-radius:10px;background:#fff;font-family:inherit}
  select:focus,.langbtn:focus{outline:none;border-color:#0b5cab}
  .hidden{display:none}
  .result{margin-top:24px;padding:18px;border-radius:12px;background:#eef5ff;border-inline-start:6px solid #0b5cab}
  .result.warn{background:#fff6e5;border-color:#e08a00}
  .result.private{background:#f2eeff;border-color:#6b4eff}
  .result .tag{font-size:12px;font-weight:600;text-transform:uppercase;color:#5b6675}
  .result .name{font-size:26px;font-weight:700;margin:4px 0 10px}
  .row{margin:8px 0;font-size:15px;line-height:1.6}
  .row b{display:inline-block;min-width:110px}
  .perm{margin:4px 0 0;padding-inline-start:20px;font-size:14px;line-height:1.6}.perm li{margin:3px 0}.perm b{min-width:0}
  .shot{display:block;width:100%;height:auto;margin-top:14px;border:1px solid #cfd8e6;border-radius:8px}
  .cap{font-size:12px;color:#5b6675;margin-top:4px;line-height:1.5}
  .link{margin-top:18px;background:none;border:none;color:#0b5cab;font-weight:600;cursor:pointer;font-size:14px;text-decoration:underline;font-family:inherit}
  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .switch{margin-top:2px;white-space:nowrap}
  /* language page */
  .langs{display:grid;gap:14px;margin-top:22px}
  .langbtn{width:100%;padding:22px;font-size:22px;font-weight:700;border:2px solid #d5deec;border-radius:14px;background:#fff;color:#0b5cab;cursor:pointer;font-family:inherit}
  .langbtn:hover{border-color:#0b5cab;background:#f3f8ff}
  .center{text-align:center}
  bdi.en{unicode-bidi:isolate}
</style>
</head>
<body>
<div class="wrap">

  <!-- MAIN PAGE: language choice -->
  <div id="langPage" class="card center">
    <h1>Sensitivity Label Advisor</h1>
    <h1 dir="rtl" style="margin-top:2px">مساعد تصنيف البيانات</h1>
    <p class="sub" style="margin-top:14px">Choose your language &nbsp;|&nbsp; <span dir="rtl">اختر لغتك</span></p>
    <div class="langs">
      <button class="langbtn" id="btnEn" type="button">English</button>
      <button class="langbtn" id="btnAr" type="button">العربية</button>
    </div>
  </div>

  <!-- ADVISOR -->
  <div id="app" class="card hidden">
    <div class="top">
      <div>
        <h1 id="title"></h1>
        <p class="sub" id="sub"></p>
      </div>
      <button class="link switch" id="switchLang" type="button"></button>
    </div>

    <label for="type" id="l1"></label>
    <select id="type"></select>

    <div id="q2" class="hidden">
      <label for="scope" id="l2"></label>
      <select id="scope"></select>
    </div>

    <div id="q3" class="hidden">
      <label for="access" id="l3"></label>
      <select id="access"></select>
    </div>

    <div id="result" class="result hidden" aria-live="polite"></div>
    <button id="reset" class="link hidden" type="button"></button>
    <button id="home" class="link" type="button" style="display:block"></button>
  </div>
</div>

/* ---------- DOM ---------- */
const $ = id => document.getElementById(id);
const langPage=$("langPage"), app=$("app"), type=$("type"), scope=$("scope"), access=$("access"),
      q2=$("q2"), q3=$("q3"), res=$("result"), reset=$("reset");
let lang = "en";

const L = (name) => `<bdi class="en" dir="ltr">${name}</bdi>`;
function opts(map, keys, t){ return `<option value="">${t.pick}</option>` + keys.map(k=>`<option value="${k}">${map[k]}</option>`).join(""); }

function buildSelects(){
  const t = UI[lang];
  const keepT=type.value, keepS=scope.value, keepA=access.value;
  $("title").textContent=t.title; $("sub").textContent=t.sub;
  $("l1").textContent=t.l1; $("l2").textContent=t.l2; $("l3").textContent=t.l3;
  $("switchLang").textContent=t.switchTo; reset.textContent=t.reset; $("home").textContent=t.home;
  type.innerHTML = opts(t.type, ["file","email"], t);
  type.value = keepT;
  fillScope(keepS);
  access.innerHTML = opts(t.access, ["view","collab","selected"], t);
  access.value = keepA;
}
function fillScope(keep){
  const t = UI[lang];
  const keys = type.value==="file" ? ["only","internal","external"] : ["internal","external"];
  scope.innerHTML = opts(t.scope, keys, t);
  scope.value = keys.includes(keep) ? keep : "";
}
function setLang(l){
  lang = l;
  document.documentElement.lang = l;
  document.documentElement.dir = UI[l].dir;
  langPage.classList.add("hidden"); app.classList.remove("hidden");
  buildSelects(); syncVisibility(); evaluate();
  if(history.replaceState){ try{history.replaceState(null,"","#"+l);}catch(e){} }
}
function showLangPage(){
  app.classList.add("hidden"); langPage.classList.remove("hidden");
  document.documentElement.lang="en"; document.documentElement.dir="ltr";
  type.value=""; scope.value=""; access.value="";
  q2.classList.add("hidden"); q3.classList.add("hidden"); res.classList.add("hidden"); reset.classList.add("hidden");
  if(history.replaceState){ try{history.replaceState(null,"",location.pathname+location.search);}catch(e){} }
}
function syncVisibility(){
  if(!type.value){ q2.classList.add("hidden"); q3.classList.add("hidden"); return; }
  q2.classList.remove("hidden");
  if(scope.value && scope.value!=="only") q3.classList.remove("hidden"); else q3.classList.add("hidden");
}
function show(html, cls){
  res.className = "result" + (cls ? " " + cls : "");
  res.innerHTML = html;
  res.classList.remove("hidden"); reset.classList.remove("hidden");
}
function img(src, alt, cap){ return `<img class="shot" src="${src}" alt="${alt}"><div class="cap">${cap}</div>`; }

function evaluate(){
  const t = UI[lang];
  res.classList.add("hidden"); reset.classList.add("hidden");
  if(!type.value || !scope.value) return;
  if(scope.value==="only"){
    show(`<div class="tag">${t.recommended}</div><div class="name">${L(t.onlyName)}</div>
          <div class="row">${t.onlyText}</div>
          <div class="row"><b>${t.apply}</b> <span dir="ltr">${t.applyFile} &gt; ${t.onlyName}</span></div>
          ${img(ONLY_ME_IMG,"Excel Sensitivity menu showing Private - Only Me above Internal and External",t.onlyCap)}`, "private");
    return;
  }
  if(!access.value) return;
  const isEmail = type.value==="email";
  const r = LABELS[scope.value+"|"+access.value];
  if(isEmail && !r.emailOk){
    show(`<div class="tag">${t.noMatch}</div><div class="name">${t.warnName}</div><div class="row">${t.warnText}</div>`, "warn");
    return;
  }
  const d = r[lang], sub = r.name.split(" ").slice(1).join(" ");
  let h = `<div class="tag">${t.recommended}</div><div class="name">${L(r.name)}</div>
           <div class="row">${d.note}</div>
           <div class="row"><b>${t.file}</b> ${d.file}</div>
           <div class="row"><b>${t.email}</b> ${d.email}</div>
           <div class="row"><b>${t.apply}</b> <span dir="ltr">${isEmail?t.applyMail:t.applyFile} &gt; ${r.scope} &gt; ${sub}</span></div>`;
  if(isEmail){
    if(r.emailImg) h += img(r.emailImg, "Outlook sensitivity menu for "+r.name, t.capMail(r.scope, r.name, r.mailX[lang]));
  } else {
    if(r.perms) h += `<div class="row"><b>${t.whoWhat}</b></div><ul class="perm">${t.perms.map(p=>`<li><b>${p[0]}</b> ${p[1]}</li>`).join("")}</ul>`;
    if(r.img)  h += img(r.img,  "Excel Sensitivity menu for "+r.name, t.capFile(r.scope, r.name, !!r.img2));
    if(r.img2) h += img(r.img2, "Excel Permissions window", t.capPerm(!!r.ext));
  }
  show(h, "");
}

/* ---------- Events ---------- */
$("btnEn").addEventListener("click",()=>setLang("en"));
$("btnAr").addEventListener("click",()=>setLang("ar"));
$("switchLang").addEventListener("click",()=>setLang(lang==="en"?"ar":"en"));
$("home").addEventListener("click",showLangPage);
type.addEventListener("change",()=>{ fillScope(""); access.value=""; syncVisibility(); evaluate(); });
scope.addEventListener("change",()=>{ access.value=""; syncVisibility(); evaluate(); });
access.addEventListener("change", evaluate);
reset.addEventListener("click",()=>{ type.value=""; scope.value=""; access.value=""; syncVisibility(); res.classList.add("hidden"); reset.classList.add("hidden"); });

/* direct links: .../index.html#ar or #en skip the language page */
const h = (location.hash||"").replace("#","").toLowerCase();
if(h==="ar" || h==="en") setLang(h);
</script>
</body>
</html>
